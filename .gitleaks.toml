# Hermes Fleet gitleaks configuration.
#
# Baseline: gitleaks default rules (useDefault = true), extended with
# scoped, documented allowlist entries for known false positives
# (gitleaks 8.x array form: one [[allowlists]] block per suppression).
title = "Hermes Fleet gitleaks config"

[extend]
useDefault = true

# Allowlist (scoped, documented — never blanket):
# - `dGhlIHNhbXBsZSBub25jZQ==` is the canonical RFC 6455 §1.3 example
#   Sec-WebSocket-Key (base64 of the literal string "the sample nonce"),
#   used by WebSocket handshake probes to validate the gateway's
#   Sec-WebSocket-Accept. It is a public specification test vector, not a
#   credential. The generic-api-key rule flags it by entropy alone.
# - `storageKey = "fleet.conversation.pins.v1"` in
#   Packages/FleetCore/Sources/FleetCore/ConversationPinning.swift is the
#   versioned UserDefaults key for the local conversation-pin store. It is
#   a namespaced persistence constant, not a credential — nothing
#   authenticates with it. The generic-api-key rule flags it by entropy
#   alone (3.77). Suppression is line-anchored (regexTarget = "line") to
#   the exact `public static let` declaration text, NOT path-scoped:
#   gitleaks 8.x ORs paths/regexes within one [[allowlists]] block, so
#   adding a path would skip the whole file and mask real secrets there.
#   This way the same literal in any other shape or file (or any other
#   high-entropy value in this file) still fails the gate — verified with
#   planted-canary probes.
[[allowlists]]
description = "RFC 6455 sample nonce (public spec test vector, not a secret)"
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]

[[allowlists]]
description = "FleetCore UserDefaults pin storage key (persistence constant, not a credential)"
regexTarget = "line"
regexes = [
  '''^\s*public static let storageKey = "fleet\.conversation\.pins\.v1"\s*$''',
]

# RFC 9180 Appendix A.2 (DHKEM(X25519, HKDF-SHA256), HKDF-SHA256,
# ChaCha20Poly1305) test-vector recipient private key, shared secret and AEAD
# key, reused by integrations/hermes-liveops/tests/fixtures/push_hpke_vectors.json
# so the Python sender and the iOS extension prove HPKE interoperability. They
# are published, non-secret specification values that protect nothing; the
# generic-api-key rule flags them by entropy alone. Value-anchored, NOT
# path-scoped, so any other high-entropy value in that file still fails.
[[allowlists]]
description = "RFC 9180 A.2 published HPKE test-vector values (not secrets)"
regexes = [
  '''8057991eef8f1f1af18f4a9491d16a1ce333f695d4db8e38da75975c4478e0fb''',
  '''0bbe78490412b4bbea4812666f7916932b828bba79942424abb65244930d69a7''',
  '''ad2744de8e17f4ebba575b3f5f5a8fa1f69c2a07f6e7500bc60ca6e3e3ec1c91''',
]
