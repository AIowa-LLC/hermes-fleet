name: HermesFleetApp
options:
  bundleIdPrefix: com.tonysimons
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: <personal-team-id>
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  FleetCore:
    path: Packages/FleetCore
  FleetNetworking:
    path: Packages/FleetNetworking
  FleetSecurity:
    path: Packages/FleetSecurity
  FleetPersistence:
    path: Packages/FleetPersistence
  FleetUI:
    path: Packages/FleetUI

targets:
  HermesFleetApp:
    type: application
    platform: iOS
    sources:
      - HermesFleetApp
    dependencies:
      - package: FleetCore
      - package: FleetNetworking
      - package: FleetSecurity
      - package: FleetPersistence
      - package: FleetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: <legacy-personal-bundle-id>
        PRODUCT_NAME: HermesFleetApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Fleet
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  HermesFleetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesFleetAppTests
      # The shared in-process gateway fixture lives in the FleetNetworking
      # package's test target; compile the SAME file into the app test bundle
      # so hosted (iOS-simulator) tests drive real transports against it
      # (single source of truth, U3 fixture full-loop suite).
      - path: Packages/FleetNetworking/Tests/FleetNetworkingTests/InProcessWebSocketServer.swift
    dependencies:
      - target: HermesFleetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonysimons.HermesFleetAppTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HermesFleetApp:
    build:
      targets:
        HermesFleetApp: all
        HermesFleetAppTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - HermesFleetAppTests
