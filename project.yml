name: HermesFleetApp
options:
  bundleIdPrefix: com.aiowa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3JS22HX92T
    CURRENT_PROJECT_VERSION: 97
    MARKETING_VERSION: 0.2.0

packages:
  FleetCore:
    path: Packages/FleetCore
  FleetNetworking:
    path: Packages/FleetNetworking
  FleetSecurity:
    path: Packages/FleetSecurity
  FleetPersistence:
    path: Packages/FleetPersistence
  FleetUI:
    path: Packages/FleetUI
  FleetWatchKit:
    path: Packages/FleetWatchKit

targets:
  HermesFleetApp:
    type: application
    platform: iOS
    sources:
      - HermesFleetApp
    resources:
      - HermesFleetApp/PrivacyInfo.xcprivacy
    dependencies:
      - package: FleetCore
      - package: FleetNetworking
      - package: FleetSecurity
      - package: FleetPersistence
      - package: FleetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.hermesfleet
        PRODUCT_NAME: HermesFleetApp
        GENERATE_INFOPLIST_FILE: YES
        # Partial Info.plist values are merged with generated INFOPLIST_KEY_*
        # settings. Local-network access and privacy usage strings live there.
        INFOPLIST_FILE: HermesFleetApp/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Fleet
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: FleetWing
        ENABLE_PREVIEWS: YES
        # Automatic signing supports local development. Distribution workflows
        # may override signing settings per invocation when appropriate.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3JS22HX92T

  HermesFleetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesFleetAppTests
      # Compile the shared in-process gateway fixture into the hosted app test
      # bundle so integration tests exercise the same transport fixture source.
      - path: Packages/FleetNetworking/Tests/FleetNetworkingTests/InProcessWebSocketServer.swift
    dependencies:
      - target: HermesFleetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.HermesFleetAppTests
        GENERATE_INFOPLIST_FILE: YES

  # Compile only the security-policy suite in Release; the broad hosted bundle
  # contains intentional Debug-only scripted fixtures.
  HermesFleetReleaseHygieneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermesFleetAppTests/LaunchOverrideHygieneTests.swift
    dependencies:
      - target: HermesFleetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.HermesFleetReleaseHygieneTests
        GENERATE_INFOPLIST_FILE: YES

  HermesFleetAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HermesFleetAppUITests
    dependencies:
      - target: HermesFleetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.HermesFleetAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesFleetApp

  # Independent internal development app. Production settings remain above.
  HermesFleetDev:
    type: application
    platform: iOS
    sources:
      - path: HermesFleetApp
        excludes:
          - Info.plist
      # Dev-only phone side of the Apple Watch link. Never in production.
      - path: HermesFleetDevWatchBridge
    resources:
      - HermesFleetApp/PrivacyInfo.xcprivacy
    dependencies:
      - package: FleetCore
      - package: FleetNetworking
      - package: FleetSecurity
      - package: FleetPersistence
      - package: FleetUI
      - package: FleetWatchKit
      - target: HermesFleetDevWatch
    configFiles:
      Debug: Config/FleetDev.xcconfig
      Release: Config/FleetDev.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.hermesfleet.dev
        PRODUCT_NAME: HermesFleetDev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/FleetDevInfo.plist
        CODE_SIGN_ENTITLEMENTS: Config/FleetDev.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Fleet Dev
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: FleetWing
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        FLEET_DEV_BUILD: "YES"
        FLEET_URL_SCHEME: hermes-fleet-dev
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLEET_DEV"

  HermesFleetDevTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesFleetDevTests
    dependencies:
      - target: HermesFleetDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.hermesfleet.dev.tests
        GENERATE_INFOPLIST_FILE: YES

  # Native Apple Watch companion for Fleet Dev. Talks only to its own paired
  # Fleet Dev iPhone app through WatchConnectivity; holds no credentials and
  # links neither FleetNetworking nor FleetSecurity.
  HermesFleetDevWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: HermesFleetDevWatch
    dependencies:
      - package: FleetWatchKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.hermesfleet.dev.watchkitapp
        PRODUCT_NAME: HermesFleetDevWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fleet Dev
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.aiowa.hermesfleet.dev
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3JS22HX92T
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLEET_DEV"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HermesFleetDevWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesFleetDevWatchTests
    dependencies:
      - target: HermesFleetDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiowa.hermesfleet.dev.watchtests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HermesFleetApp:
    build:
      targets:
        HermesFleetApp: all
        HermesFleetAppTests: [test]
        HermesFleetAppUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - HermesFleetAppTests
        - HermesFleetAppUITests
  # Device-hosted unit-test scheme without the UI-test bundle. This keeps
  # unit-only validation available when an XCUITest runner is unnecessary.
  HermesFleetAppUnitTests:
    build:
      targets:
        HermesFleetApp: all
        HermesFleetAppTests: [test]
    test:
      targets:
        - HermesFleetAppTests
  HermesFleetReleaseHygiene:
    build:
      targets:
        HermesFleetApp: all
        HermesFleetReleaseHygieneTests: [test]
    test:
      config: Release
      targets:
        - HermesFleetReleaseHygieneTests
  HermesFleetDev:
    build:
      targets:
        HermesFleetDev: all
    run:
      config: Debug
    archive:
      config: Release
  HermesFleetDevTests:
    build:
      targets:
        HermesFleetDev: all
        HermesFleetDevTests: [test]
    test:
      targets:
        - HermesFleetDevTests
  HermesFleetDevWatchTests:
    build:
      targets:
        HermesFleetDev: all
        HermesFleetDevWatchTests: [test]
    test:
      targets:
        - HermesFleetDevWatchTests
