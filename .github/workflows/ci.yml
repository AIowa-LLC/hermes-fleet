name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  # Refreshes to one PR or main may supersede one another, but a queued
  # merge-group candidate must never have its required checks cancelled by a
  # later event.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  static-guards:
    name: Static guards (xcodegen drift, boundaries, safety, gitleaks)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install tools (xcodegen, gitleaks)
        run: brew install xcodegen gitleaks
      - name: Static phase
        run: bash scripts/c1_static.sh
      - name: CI gate policy guard
        run: bash scripts/ci_gate_policy_check.sh
      - name: CI gate executable contract test
        run: bash scripts/ci_gate_policy_contract_test.sh
      - name: UI preflight selector self-test
        run: bash scripts/c1_ui_preflight_test.sh

  packages:
    name: Package tests (FleetCore, Networking, Persistence, Security)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package phase
        run: bash scripts/c1_packages.sh

  units:
    name: Hosted unit tests (HermesFleetAppTests)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Unit phase
        run: bash scripts/c1_units.sh

  ui-shard:
    name: UI matrix shard ${{ matrix.shard }}/${{ matrix.shards }}
    # Dev Loop v2: the complete five-shard matrix is the authoritative
    # integration validation for merge_group candidates. Main pushes retain
    # static/package/unit post-merge validation without paying for the same UI
    # matrix a second time; pull requests run the focused ui-preflight below.
    if: github.event_name == 'merge_group'
    runs-on: macos-latest
    # Observed runner pace (run 34405682516): ~10 min initial build + first
    # boot, then ~3.5-11 min per suite. 10 suites/shard measured 54-61 min
    # and brushed the old 60-min ceiling; 5 shards x 8 suites lands ~45 min.
    # 75 min leaves stabilization headroom for slow runners.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        shards: [5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run UI shard
        run: bash scripts/c1_ui_matrix.sh --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}

      - name: Upload xcresults (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-shard-${{ matrix.shard }}
          path: /tmp/hermes-c1-results/
          retention-days: 7
          if-no-files-found: ignore

  ui-preflight:
    name: UI preflight (focused, pull request)
    # Dev Loop v2: pull-request UI validation is a focused subset of the same
    # deterministic inventory, selected from the changed files by
    # scripts/c1_ui_preflight.sh. The merge_group matrix above remains the
    # full authoritative gate; this job only catches obvious defects earlier.
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The selector diffs against the pull request's base commit, so the
          # full pull request history must be present.
          fetch-depth: 0
      - name: Run focused UI preflight (changed-area selection)
        run: bash scripts/c1_ui_preflight.sh --base "${{ github.event.pull_request.base.sha }}"

      - name: Upload xcresults (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-pr-preflight
          path: /tmp/hermes-c1-results/
          retention-days: 7
          if-no-files-found: ignore

  ci-gate:
    name: CI Gate
    needs: [static-guards, packages, units, ui-shard, ui-preflight]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gate evaluator
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require every validation job to have succeeded
        env:
          CI_GATE_EVENT_NAME: ${{ github.event_name }}
          CI_GATE_STATIC_RESULT: ${{ needs.static-guards.result }}
          CI_GATE_PACKAGES_RESULT: ${{ needs.packages.result }}
          CI_GATE_UNITS_RESULT: ${{ needs.units.result }}
          CI_GATE_UI_SHARD_RESULT: ${{ needs.ui-shard.result }}
          CI_GATE_UI_PREFLIGHT_RESULT: ${{ needs.ui-preflight.result }}
        run: |
          echo "CI Gate dependency results:"
          echo "${{ toJSON(needs.*.result) }}"
          bash scripts/ci_gate_policy_eval.sh
