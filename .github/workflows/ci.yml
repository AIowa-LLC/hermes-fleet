name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  # Refreshes to one PR or main may supersede one another, but a queued
  # merge-group candidate must never have its required checks cancelled by a
  # later event.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  static-guards:
    name: Static guards (xcodegen drift, boundaries, safety, gitleaks)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install tools (xcodegen, gitleaks)
        run: brew install xcodegen gitleaks
      - name: Static phase
        run: bash scripts/c1_static.sh
      - name: CI gate policy guard
        run: bash scripts/ci_gate_policy_check.sh
      - name: CI gate executable contract test
        run: bash scripts/ci_gate_policy_contract_test.sh
      - name: UI preflight selector self-test
        run: bash scripts/c1_ui_preflight_test.sh

  packages:
    name: Package tests (FleetCore, Networking, Persistence, Security)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package phase
        run: bash scripts/c1_packages.sh

  units:
    name: Hosted unit tests (HermesFleetAppTests)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Unit phase
        run: bash scripts/c1_units.sh

  critical-smoke:
    name: Critical UI smoke (merge candidate)
    # This fixed, small journey set is required on the exact merge-group
    # candidate. PRs use changed-area preflight; remaining suites stay in the
    # separate full regression workflow.
    if: github.event_name == 'merge_group'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run critical UI journeys
        run: bash scripts/c1_critical_smoke.sh
      - name: Upload xcresults and xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-critical-smoke
          path: |
            /tmp/hermes-c1-results/
            /tmp/c1_xctest_ui_*.log
          retention-days: 7
          if-no-files-found: ignore

  ui-preflight:
    name: UI preflight (focused, changed area)
    # PRs get an early changed-area check; merge candidates repeat it against
    # the merge-group base alongside the fixed critical smoke set.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The selector diffs against the base commit, so the full history is
          # needed for both pull requests and merge-group candidates.
          fetch-depth: 0
      - name: Run focused UI preflight (changed-area selection)
        run: bash scripts/c1_ui_preflight.sh --base "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
      - name: Upload xcresults (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-ui-preflight
          path: |
            /tmp/hermes-c1-results/
            /tmp/c1_xctest_ui_*.log
          retention-days: 7
          if-no-files-found: ignore

  ci-gate:
    name: CI Gate
    needs: [static-guards, packages, units, ui-preflight, critical-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gate evaluator
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require every merge validation job to have succeeded
        env:
          CI_GATE_EVENT_NAME: ${{ github.event_name }}
          CI_GATE_STATIC_RESULT: ${{ needs.static-guards.result }}
          CI_GATE_PACKAGES_RESULT: ${{ needs.packages.result }}
          CI_GATE_UNITS_RESULT: ${{ needs.units.result }}
          CI_GATE_UI_PREFLIGHT_RESULT: ${{ needs.ui-preflight.result }}
          CI_GATE_CRITICAL_SMOKE_RESULT: ${{ needs.critical-smoke.result }}
        run: |
          echo "CI Gate dependency results:"
          echo "${{ toJSON(needs.*.result) }}"
          bash scripts/ci_gate_policy_eval.sh
