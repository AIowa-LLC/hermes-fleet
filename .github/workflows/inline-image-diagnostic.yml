name: Inline image diagnostic

on:
  push:
    branches: [codex/inline-image-recovery]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify recorded toolchain and create a dedicated simulator
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/inline-diagnostic"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          git status --porcelain > "$evidence/worktree-status.txt"
          xcode-select -p > "$evidence/developer-directory.txt"
          xcodebuild -version > "$evidence/xcode-version.txt"
          xcrun simctl list runtimes > "$evidence/runtimes.txt"
          cat "$evidence/xcode-version.txt"
          grep -q 'Xcode 26.6' "$evidence/xcode-version.txt"
          grep -q 'iOS 26.5' "$evidence/runtimes.txt"
          simulator=$(xcrun simctl create HermesInlineDiagnostic com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          printf '%s\n' "$simulator" > "$evidence/simulator-id.txt"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b > "$evidence/simulator-boot.log" 2>&1
          printf 'SIMULATOR=%s\n' "$simulator" >> "$GITHUB_ENV"
      - name: Build one exact test product
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/inline-diagnostic"
          echo 'BUILD: starting'
          if ! xcodebuild -project HermesFleetApp.xcodeproj -scheme HermesFleetApp -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$evidence/DerivedData" -skipMacroValidation build-for-testing > "$evidence/build.log" 2>&1; then
            tail -60 "$evidence/build.log"
            exit 1
          fi
          echo 'BUILD: succeeded'
      - name: Run one case, then two fresh-launch checks after a pass
        shell: bash
        run: |
          set +e
          set -uo pipefail
          evidence="$RUNNER_TEMP/inline-diagnostic"
          for attempt in 1 2 3; do
            echo "TEST: attempt $attempt, fresh app launch, no repetition or retry flags"
            bundle="$evidence/InlineAttempt-$attempt.xcresult"
            xcodebuild -project HermesFleetApp.xcodeproj -scheme HermesFleetApp -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$evidence/DerivedData" -skipMacroValidation test-without-building -resultBundlePath "$bundle" -only-testing:HermesFleetAppUITests/ArtifactsDestinationUITests/testGeneratedImageRendersInlineInTheCitingToolRow > "$evidence/test-$attempt.log" 2>&1
            status=$?
            printf '%s\n' "$status" > "$evidence/test-$attempt-exit.txt"
            echo "TEST: attempt $attempt process exit $status"
            tail -18 "$evidence/test-$attempt.log"
            if [[ -d "$bundle" ]]; then
              xcrun xcresulttool get test-results summary --path "$bundle" --compact > "$evidence/summary-$attempt.json" || true
              xcrun xcresulttool get test-results tests --path "$bundle" --compact > "$evidence/tests-$attempt.json" || true
              xcrun xcresulttool export attachments --path "$bundle" --output-path "$evidence/attachments-$attempt" > "$evidence/attachment-export-$attempt.log" 2>&1 || true
            fi
            if [[ ! -f "$evidence/summary-$attempt.json" || ! -f "$evidence/tests-$attempt.json" ]]; then
              echo "RESULT: attempt $attempt missing complete result evidence"
              exit 1
            fi
            python3 scripts/c1_xcresult_parse.py --summary "$evidence/summary-$attempt.json" --tests "$evidence/tests-$attempt.json" --requested ArtifactsDestinationUITests --expect-case 'testGeneratedImageRendersInlineInTheCitingToolRow()' > "$evidence/parsed-$attempt.txt"
            parse_status=$?
            read -r count failures complete present recovered < "$evidence/parsed-$attempt.txt"
            echo "RESULT: attempt=$attempt exit=$status cases=$count failures=$failures complete=$complete present=$present recovered=$recovered parse_exit=$parse_status"
            xcrun simctl spawn "$SIMULATOR" log show --style compact --last 5m --predicate 'process == "HermesFleetApp" AND (eventMessage CONTAINS "HFInline" OR eventMessage CONTAINS "OnScrollGeometryChange Modifier")' > "$evidence/app-events-$attempt.log" 2>&1 || true
            if [[ "$status" -ne 0 || "$parse_status" -ne 0 || "$count" -ne 1 || "$failures" -ne 0 || "$complete" -ne 1 || "$present" -ne 1 || "$recovered" -ne 0 ]]; then
              exit 1
            fi
            xcrun simctl terminate "$SIMULATOR" com.aiowa.hermesfleet >/dev/null 2>&1 || true
          done
          echo 'TEST: all three fresh-launch executions passed'
      - name: Preserve private diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inline-image-diagnostic
          path: |
            ${{ runner.temp }}/inline-diagnostic/*.txt
            ${{ runner.temp }}/inline-diagnostic/*.log
            ${{ runner.temp }}/inline-diagnostic/*.json
            ${{ runner.temp }}/inline-diagnostic/InlineAttempt-*.xcresult/
            ${{ runner.temp }}/inline-diagnostic/attachments-*/
          retention-days: 7
          if-no-files-found: warn
