name: Inline image diagnostic

on:
  push:
    branches: [codex/inline-image-recovery]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify recorded toolchain and create a dedicated simulator
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/inline-diagnostic"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          git status --porcelain > "$evidence/worktree-status.txt"
          xcode-select -p > "$evidence/developer-directory.txt"
          xcodebuild -version > "$evidence/xcode-version.txt"
          xcrun simctl list runtimes > "$evidence/runtimes.txt"
          cat "$evidence/xcode-version.txt"
          grep -q 'Xcode 26.6' "$evidence/xcode-version.txt"
          grep -q 'iOS 26.5' "$evidence/runtimes.txt"
          simulator=$(xcrun simctl create HermesInlineDiagnostic com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          printf '%s\n' "$simulator" > "$evidence/simulator-id.txt"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b > "$evidence/simulator-boot.log" 2>&1
          printf 'SIMULATOR=%s\n' "$simulator" >> "$GITHUB_ENV"
      - name: Build one exact test product
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/inline-diagnostic"
          echo 'BUILD: starting'
          if ! xcodebuild -project HermesFleetApp.xcodeproj -scheme HermesFleetApp -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$evidence/DerivedData" -skipMacroValidation build-for-testing > "$evidence/build.log" 2>&1; then
            tail -60 "$evidence/build.log"
            exit 1
          fi
          echo 'BUILD: succeeded'
      - name: Run one case and sample the target app
        shell: bash
        run: |
          set +e
          set -uo pipefail
          evidence="$RUNNER_TEMP/inline-diagnostic"
          echo 'TEST: launching once, no repetition or retry flags'
          xcodebuild -project HermesFleetApp.xcodeproj -scheme HermesFleetApp -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$evidence/DerivedData" -skipMacroValidation test-without-building -resultBundlePath "$evidence/InlineDiagnostic.xcresult" -only-testing:HermesFleetAppUITests/ArtifactsDestinationUITests/testGeneratedImageRendersInlineInTheCitingToolRow > "$evidence/test.log" 2>&1 &
          test_pid=$!
          for ((i=0; i<150; i++)); do
            if grep -q 'Waiting 20.0s for.*fleet.conversation.row.row-2' "$evidence/test.log"; then
              echo 'PROFILE: citing-row query reached'
              targets=$(ps -axo pid=,command= | awk -v sim="$SIMULATOR" 'index($0,sim)>0 && index($0,"/HermesFleetApp.app/HermesFleetApp")>0 {print $1}')
              count=$(printf '%s\n' "$targets" | awk 'NF {n++} END {print n+0}')
              printf 'target_count=%s\n' "$count" > "$evidence/sample-target.txt"
              if [[ "$count" -eq 1 ]]; then
                printf 'pid=%s\n' "$targets" >> "$evidence/sample-target.txt"
                /usr/bin/sample "$targets" 25 -file "$evidence/app.sample.txt" > "$evidence/sample.log" 2>&1 || true
              fi
              break
            fi
            kill -0 "$test_pid" 2>/dev/null || break
            sleep 1
          done
          status=0
          wait "$test_pid" || status=$?
          printf '%s\n' "$status" > "$evidence/test-exit.txt"
          echo "TEST: process exit $status"
          tail -45 "$evidence/test.log"
          echo 'EXPORT: collecting app event markers and result summary'
          xcrun simctl spawn "$SIMULATOR" log show --style compact --last 12m --predicate 'process == "HermesFleetApp" AND eventMessage CONTAINS "HFInline"' > "$evidence/app-events.log" 2>&1 || true
          if [[ -d "$evidence/InlineDiagnostic.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$evidence/InlineDiagnostic.xcresult" --compact > "$evidence/summary.json" || true
            xcrun xcresulttool get test-results tests --path "$evidence/InlineDiagnostic.xcresult" --compact > "$evidence/tests.json" || true
            xcrun xcresulttool export attachments --path "$evidence/InlineDiagnostic.xcresult" --output-path "$evidence/attachments" > "$evidence/attachment-export.log" 2>&1 || true
          fi
          if [[ -f "$evidence/summary.json" && -f "$evidence/tests.json" ]]; then
            python3 scripts/c1_xcresult_parse.py --summary "$evidence/summary.json" --tests "$evidence/tests.json" --requested ArtifactsDestinationUITests --expect-case 'testGeneratedImageRendersInlineInTheCitingToolRow()' > "$evidence/parsed-result.txt" || true
          fi
          if [[ -f "$evidence/parsed-result.txt" ]]; then
            read -r count failures complete present recovered < "$evidence/parsed-result.txt"
            echo "RESULT: cases=$count failures=$failures complete=$complete present=$present recovered=$recovered"
            [[ "$status" -eq 0 && "$count" -eq 1 && "$failures" -eq 0 && "$complete" -eq 1 && "$present" -eq 1 && "$recovered" -eq 0 ]]
          else
            exit 1
          fi
      - name: Preserve private diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inline-image-diagnostic
          path: |
            ${{ runner.temp }}/inline-diagnostic/*.txt
            ${{ runner.temp }}/inline-diagnostic/*.log
            ${{ runner.temp }}/inline-diagnostic/*.json
            ${{ runner.temp }}/inline-diagnostic/InlineDiagnostic.xcresult/
            ${{ runner.temp }}/inline-diagnostic/attachments/
          retention-days: 7
          if-no-files-found: warn
