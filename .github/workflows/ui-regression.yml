name: Full UI Regression

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'

concurrency:
  # Deep runs are evidence for a particular source ref; do not cancel one
  # because another validation run starts on the same ref.
  group: ui-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-shard:
    name: Full UI matrix shard ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      HERMES_FLEET_LANE_SIM: "1"
    # Deep validation retains a generous independent ceiling. Measure its
    # actual runtime separately from the focused merge path.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        shards: [5]
    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify released Xcode toolchain
        run: |
          actual_xcode="$(xcodebuild -version)"
          printf '%s\n' "$actual_xcode"
          test "$actual_xcode" = $'Xcode 27.0\nBuild version 27A266a'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
      - name: Run full deterministic UI shard
        run: bash scripts/c1_ui_matrix.sh --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}
      - name: Upload xcresults and xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-full-ui-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/hermes-c1-results*/
          retention-days: 14
          if-no-files-found: ignore

  ui-regression-gate:
    name: Full UI Regression Gate
    needs: [ui-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every full-matrix shard to pass
        env:
          UI_MATRIX_RESULT: ${{ needs.ui-shard.result }}
        run: |
          echo "Full UI matrix result: $UI_MATRIX_RESULT"
          if [ "$UI_MATRIX_RESULT" != "success" ]; then
            echo "::error::Full deterministic UI matrix did not pass. Inspect shard logs and xcresult artifacts."
            exit 1
          fi
          echo "Full deterministic UI matrix passed."
